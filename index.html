<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MediaFlow Lite V1.4</title><style>
:root{font-family:system-ui,-apple-system,'Noto Sans TC',sans-serif;color:#19233a;background:#f4f6fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1200px;margin:auto;padding:24px}.top,.panel{background:white;border:1px solid #e1e6ef;border-radius:14px;padding:20px;margin-bottom:16px}.top,.flex{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1{margin:0;font-size:25px}h2{font-size:17px;margin:0 0 12px}.muted{color:#6a7487;font-size:13px}button{cursor:pointer;border:1px solid #dce2ec;border-radius:8px;background:white;color:#25344d;padding:9px 12px;font:inherit}button.primary{background:#345edb;color:white;border-color:#345edb}button.danger{color:#b32639}input,select{font:inherit;border:1px solid #dce2ec;border-radius:7px;padding:8px;background:white;color:#26334a;min-width:0}input:focus,select:focus{outline:2px solid #9db6ff}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{padding:15px;background:#f7f9ff;border-radius:10px}.stat strong{display:block;font-size:26px;margin-top:3px}.tools{display:flex;gap:9px;flex-wrap:wrap;margin:16px 0}.tools>*{flex:1;min-width:120px}.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:850px}th{text-align:left;background:#f5f7fb;color:#66728a;font-size:12px}th,td{padding:10px;border-bottom:1px solid #e9edf3}td input,td select{width:100%;font-size:13px}.overdue{color:#b32639;font-size:11px;font-weight:600}.done{color:#13805c}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.formgrid label{display:block;font-size:12px;color:#6a7487;margin-bottom:5px}.formgrid input{width:100%}.hidden{display:none}.message{margin:12px 0;color:#246c54;font-size:13px;min-height:18px}.smallbtn{font-size:12px;padding:7px 9px}.foot{font-size:12px;color:#6a7487;line-height:1.7}.actions{display:flex;gap:8px;flex-wrap:wrap}@media(max-width:650px){.wrap{padding:10px}.top,.panel{padding:14px}.formgrid{grid-template-columns:1fr}.stats{gap:7px}.stat{padding:10px}.stat strong{font-size:22px}}
</style></head><body><main class="wrap"><header class="top"><div><h1>◈ MediaFlow Lite <span style="font-size:12px;color:#6a7487">V1.4</span></h1><div class="muted">影片管理 · 快速操作 · 本機自動儲存</div></div><div class="actions"><button id="exportBtn">匯出備份</button><button id="importBtn">匯入備份</button><input id="importFile" type="file" accept="application/json,.json" class="hidden"><button class="primary" id="addBtn">＋ 新增影片</button></div></header><section class="panel"><div id="stats" class="stats"></div><div class="flex" style="margin-top:12px"><span class="muted">上片完成率</span><strong id="rate">0%</strong></div><div style="background:#e9edf6;height:7px;border-radius:10px;margin-top:8px"><div id="bar" style="height:100%;background:#345edb;width:0%;border-radius:10px"></div></div></section><section class="panel"><div id="editor" class="hidden"><h2 id="editorTitle">快速新增影片</h2><div class="formgrid"><div><label for="title">影片名稱</label><input id="title"></div><div><label for="client">客戶名稱</label><input id="client" list="clients"><datalist id="clients"></datalist></div><div><label for="owner">負責人</label><input id="owner" list="owners"><datalist id="owners"></datalist></div><div><label for="due">截止日期</label><input id="due" type="date"></div></div><div class="actions" style="margin-top:14px"><button class="primary" id="saveBtn">儲存影片</button><button id="cancelBtn">取消</button><button id="deleteBtn" class="danger hidden">刪除影片</button></div></div><div class="tools"><input id="month" type="month" aria-label="月份"><select id="clientFilter" aria-label="客戶篩選"><option value="all">全部客戶</option></select><input id="search" placeholder="搜尋影片、負責人" aria-label="搜尋"><select id="sort" aria-label="排序"><option value="priority">優先處理</option><option value="date">截止日期</option><option value="recent">最新新增</option></select></div><div class="flex"><h2>影片工作清單</h2><span id="count" class="muted"></span></div><div class="scroll"><table><thead><tr><th style="min-width:170px">影片名稱</th><th style="min-width:110px">客戶</th><th style="min-width:110px">負責人</th><th style="min-width:145px">截止日期</th><th style="min-width:145px">工作狀態</th><th style="min-width:120px">快速操作</th></tr></thead><tbody id="rows"></tbody></table></div><div id="message" class="message" role="status" aria-live="polite"></div><p class="foot">資料會自動儲存在目前瀏覽器。更換裝置、瀏覽器、網站網址，或清除網站資料後可能無法讀取。請定期使用「匯出備份」保存 JSON 檔案。公開網站不具備登入與多人同步功能，請勿存放敏感客戶資訊。</p></section></main><script>
(()=>{'use strict';const KEY='mediaflow-lite-v14-data',STAGES=['腳本／拍攝','剪輯中','待客戶確認','待上片','已上片'];const $=id=>document.getElementById(id);const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};const monthNow=today().slice(0,7);let data=[],editId=null,lastClient='',lastOwner='',clientFilter='all';let saveOK=true;function message(s){$('message').textContent=s}function persist(){try{localStorage.setItem(KEY,JSON.stringify(data));saveOK=true;return true}catch(e){saveOK=false;message('無法寫入本機儲存空間，請匯出備份，確認瀏覽器儲存設定。');return false}}function valid(v){return v&&typeof v==='object'&&Number.isSafeInteger(v.id)&&typeof v.title==='string'&&typeof v.client==='string'&&typeof v.owner==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(v.date)&&STAGES.includes(v.status)}try{const raw=localStorage.getItem(KEY);if(raw!==null){const parsed=JSON.parse(raw);if(!Array.isArray(parsed)||!parsed.every(valid))throw Error('bad');data=parsed}}catch(e){message('舊資料讀取失敗，請匯入先前的備份；目前不會覆寫舊資料。');saveOK=false}const h=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));$('month').value=monthNow;function current(){const q=$('search').value.toLowerCase().trim(),m=$('month').value;return data.filter(v=>v.date.slice(0,7)===m&&(clientFilter==='all'||v.client===clientFilter)&&(v.title+' '+v.client+' '+v.owner).toLowerCase().includes(q)).sort((a,b)=>{const mode=$('sort').value;if(mode==='recent')return b.id-a.id;if(mode==='date')return a.date.localeCompare(b.date);const p=v=>v.status==='已上片'?2:v.date<today()?0:1;return p(a)-p(b)||a.date.localeCompare(b.date)})}function render(){const clients=[...new Set(data.map(v=>v.client))].sort();$('clientFilter').innerHTML='<option value="all">全部客戶</option>'+clients.map(c=>'<option value="'+h(c)+'">'+h(c)+'</option>').join('');if(clientFilter!=='all'&&!clients.includes(clientFilter))clientFilter='all';$('clientFilter').value=clientFilter;const list=current(),done=list.filter(v=>v.status==='已上片').length,pending=list.length-done;const stat=[['影片總數',list.length],['已上片',done],['待處理',pending]];$('stats').innerHTML=stat.map(([k,v])=>'<div class="stat"><span class="muted">'+k+'</span><strong>'+v+'</strong></div>').join('');const rate=list.length?Math.round(done/list.length*100):0;$('rate').textContent=rate+'%';$('bar').style.width=rate+'%';$('count').textContent=list.length+' 支影片';$('rows').innerHTML=list.map(v=>{const overdue=v.status!=='已上片'&&v.date<today();return '<tr><td><input aria-label="影片名稱" data-id="'+v.id+'" data-field="title" value="'+h(v.title)+'">'+(overdue?'<div class="overdue">逾期未完成</div>':'')+'</td><td><input aria-label="客戶" data-id="'+v.id+'" data-field="client" value="'+h(v.client)+'"></td><td><input aria-label="負責人" data-id="'+v.id+'" data-field="owner" value="'+h(v.owner)+'"></td><td><input type="date" aria-label="截止日期" data-id="'+v.id+'" data-field="date" value="'+h(v.date)+'"></td><td><select aria-label="工作狀態" data-id="'+v.id+'" data-field="status">'+STAGES.map(s=>'<option '+(v.status===s?'selected ':'')+'value="'+h(s)+'">'+h(s)+'</option>').join('')+'</select></td><td>'+(v.status==='已上片'?'<span class="done">✓ 已完成</span>':'<button class="smallbtn" data-next="'+v.id+'">下一階段 ›</button>')+' <button class="smallbtn" data-edit="'+v.id+'">編輯</button></td></tr>'}).join('')||'<tr><td colspan="6" style="text-align:center;padding:24px;color:#6a7487">目前沒有符合條件的影片，請新增或調整篩選條件。</td></tr>'; $('clients').innerHTML=clients.map(c=>'<option value="'+h(c)+'"></option>').join('');$('owners').innerHTML=[...new Set(data.map(v=>v.owner))].map(o=>'<option value="'+h(o)+'"></option>').join('')}
function openForm(id=null){editId=id;const v=data.find(x=>x.id===id);$('editor').classList.remove('hidden');$('editorTitle').textContent=v?'編輯影片':'快速新增影片';$('title').value=v?.title||'';$('client').value=v?.client||lastClient;$('owner').value=v?.owner||lastOwner;$('due').value=v?.date||today();$('deleteBtn').classList.toggle('hidden',!v);$('title').focus()}function closeForm(){editId=null;$('editor').classList.add('hidden')}function commit(){if(!saveOK){message('目前儲存空間未就緒，請先匯出備份或修復瀏覽器儲存設定。');return}const title=$('title').value.trim(),client=$('client').value.trim(),owner=$('owner').value.trim(),date=$('due').value;if(!title||!client||!owner||!date){message('請填寫影片名稱、客戶、負責人及截止日期。');return}const prev=JSON.stringify(data);if(editId===null){data.push({id:Math.max(0,...data.map(v=>v.id))+1,title,client,owner,date,status:STAGES[0]})}else{const v=data.find(x=>x.id===editId);if(!v)return;Object.assign(v,{title,client,owner,date})}if(!persist()){data=JSON.parse(prev);return}lastClient=client;lastOwner=owner;$('month').value=date.slice(0,7);clientFilter='all';$('search').value='';closeForm();render();message('✓ 已儲存並寫入本機資料')}function mutate(id,field,value){const v=data.find(x=>x.id===id);if(!v)return;if(!value.trim()){message('欄位不可留空');render();return}const before=v[field];v[field]=value.trim();if(!persist()){v[field]=before;render();return}if(field==='date')$('month').value=v.date.slice(0,7);render();message('✓ 已自動儲存：'+v.title)}$('addBtn').onclick=()=>openForm();$('cancelBtn').onclick=closeForm;$('saveBtn').onclick=commit;$('deleteBtn').onclick=()=>{if(editId===null||!confirm('確定刪除此影片？'))return;const old=data;data=data.filter(v=>v.id!==editId);if(!persist()){data=old;return}closeForm();render();message('影片已刪除並儲存')};$('rows').addEventListener('click',e=>{const n=e.target.closest('[data-next]'),b=e.target.closest('[data-edit]');if(n){const v=data.find(x=>x.id===Number(n.dataset.next));if(v){const i=STAGES.indexOf(v.status);if(i<STAGES.length-1)mutate(v.id,'status',STAGES[i+1])}}else if(b)openForm(Number(b.dataset.edit))});$('rows').addEventListener('change',e=>{const t=e.target;if(t.dataset.field)mutate(Number(t.dataset.id),t.dataset.field,t.value)});$('month').onchange=render;$('clientFilter').onchange=e=>{clientFilter=e.target.value;render()};$('sort').onchange=render;$('search').oninput=render;$('exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify({app:'MediaFlow Lite',version:'1.4',exportedAt:new Date().toISOString(),videos:data},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='mediaflow-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);message('備份檔已準備下載')};$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const json=JSON.parse(await file.text());if(!json||!Array.isArray(json.videos)||!json.videos.every(valid))throw Error('格式不正確');if(!confirm('匯入會取代目前全部影片，建議先匯出備份。確定繼續？'))return;const old=data;data=json.videos;if(!persist()){data=old;return}closeForm();clientFilter='all';$('search').value='';render();message('✓ 已匯入 '+data.length+' 支影片')}catch(err){message('匯入失敗：請選擇 MediaFlow JSON 備份檔')}finally{e.target.value=''}};render();})();
</script></body></html>
