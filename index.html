</style></head><body><section class="wrap" id="loginPanel"><div class="panel" style="max-width:440px;margin:8vh auto"><h1>MediaFlow Lite V1.5</h1><p class="muted">團隊帳號登入</p><form id="loginForm"><p><input style="width:100%" id="email" type="email" placeholder="Email" required autocomplete="username"></p><p><input style="width:100%" id="password" type="password" placeholder="密碼" required autocomplete="current-password"></p><button class="primary" id="loginBtn">登入</button></form><p id="loginMessage" role="status"></p></div></section><main class="wrap hidden" id="app"><header class="top"><div><h1>◈ MediaFlow Lite <span style="font-size:12px;color:#6a7487">V1.5</span></h1><div class="muted">影片管理 · 快速操作 · 雲端儲存</div></div><div class="actions"><span id="profile" class="muted"></span><button id="logoutBtn">登出</button><button id="refreshBtn">重新整理</button><button id="exportBtn">匯出備份</button><button id="importBtn" class="hidden">匯入備份</button><input id="importFile" type="file" accept="application/json,.json" class="hidden"><button class="primary" id="addBtn">＋ 新增影片</button></div></header><section class="panel"><div id="stats" class="stats"></div><div class="flex" style="margin-top:12px"><span class="muted">上片完成率</span><strong id="rate">0%</strong></div><div style="background:#e9edf6;height:7px;border-radius:10px;margin-top:8px"><div id="bar" style="height:100%;background:#345edb;width:0%;border-radius:10px"></div></div></section><section class="panel"><div id="editor" class="hidden"><h2 id="editorTitle">快速新增影片</h2><div class="formgrid"><div><label for="title">影片名稱</label><input id="title"></div><div><label for="client">客戶名稱</label><input id="client" list="clients"><datalist id="clients"></datalist></div><div><label for="owner">負責人</label><input id="owner" list="owners"><datalist id="owners"></datalist></div><div><label for="due">截止日期</label><input id="due" type="date"></div></div><div class="actions" style="margin-top:14px"><button class="primary" id="saveBtn">儲存影片</button><button id="cancelBtn">取消</button><button id="deleteBtn" class="danger hidden">刪除影片</button></div></div><div class="tools"><input id="month" type="month" aria-label="月份"><select id="clientFilter" aria-label="客戶篩選"><option value="all">全部客戶</option></select><input id="search" placeholder="搜尋影片、負責人" aria-label="搜尋"><select id="sort" aria-label="排序"><option value="priority">優先處理</option><option value="date">截止日期</option><option value="recent">最新新增</option></select></div><div class="flex"><h2>影片工作清單</h2><span id="count" class="muted"></span></div><div class="scroll"><table><thead><tr><th style="min-width:170px">影片名稱</th><th style="min-width:110px">客戶</th><th style="min-width:110px">負責人</th><th style="min-width:145px">截止日期</th><th style="min-width:145px">工作狀態</th><th style="min-width:120px">快速操作</th></tr></thead><tbody id="rows"></tbody></table></div><div id="message" class="message" role="status" aria-live="polite"></div><p class="foot">資料儲存於 Supabase。重新整理可取得團隊最新資料。V1.4 本機資料不會自動移轉，請保留原始備份。</p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
(()=>{'use strict';const KEY='mediaflow-lite-v14-data',STAGES=['腳本／拍攝','剪輯中','待客戶確認','待上片','已上片'];const $=id=>document.getElementById(id);const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};const monthNow=today().slice(0,7);let data=[],editId=null,lastClient='',lastOwner='',clientFilter='all';let member=null,busy=false;const db=window.supabase?.createClient('https://iilfpgbumppsswsdgjxw.supabase.co','sb_publishable_zJoOnK8ODXMX6RtLuPMovg_fM6LxaW3');function message(s){$('message').textContent=s}function unpack(v){return {id:v.id,title:v.title??'',client:v.client??'',owner:v.owner??'',date:v.due_date??'',status:v.status??STAGES[0]}}async function load(){const {data:rows,error}=await db.from('videos').select('id,title,client,owner,due_date,status').order('id',{ascending:false});if(error)throw error;data=rows.map(unpack);render()}async function enter(user){const {data:m,error}=await db.from('team_members').select('name,role,active').eq('user_id',user.id).maybeSingle();if(error)throw error;if(!m?.active)throw Error('此帳號未啟用團隊權限');member=m;await load();$('profile').textContent=m.name+' · '+m.role;$('loginPanel').classList.add('hidden');$('app').classList.remove('hidden')}function reset(){member=null;data=[];closeForm();render();$('app').classList.add('hidden');$('loginPanel').classList.remove('hidden')}async function task(fn){if(busy||!member)return;busy=true;try{await fn()}catch(e){message('操作失敗：'+e.message);try{await load()}catch{} }finally{busy=false}}const h=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));$('month').value=monthNow;function current(){const q=$('search').value.toLowerCase().trim(),m=$('month').value;return data.filter(v=>v.date.slice(0,7)===m&&(clientFilter==='all'||v.client===clientFilter)&&(v.title+' '+v.client+' '+v.owner).toLowerCase().includes(q)).sort((a,b)=>{const mode=$('sort').value;if(mode==='recent')return b.id-a.id;if(mode==='date')return a.date.localeCompare(b.date);const p=v=>v.status==='已上片'?2:v.date<today()?0:1;return p(a)-p(b)||a.date.localeCompare(b.date)})}function render(){const clients=[...new Set(data.map(v=>v.client))].sort();$('clientFilter').innerHTML='<option value="all">全部客戶</option>'+clients.map(c=>'<option value="'+h(c)+'">'+h(c)+'</option>').join('');if(clientFilter!=='all'&&!clients.includes(clientFilter))clientFilter='all';$('clientFilter').value=clientFilter;const list=current(),done=list.filter(v=>v.status==='已上片').length,pending=list.length-done;const stat=[['影片總數',list.length],['已上片',done],['待處理',pending]];$('stats').innerHTML=stat.map(([k,v])=>'<div class="stat"><span class="muted">'+k+'</span><strong>'+v+'</strong></div>').join('');const rate=list.length?Math.round(done/list.length*100):0;$('rate').textContent=rate+'%';$('bar').style.width=rate+'%';$('count').textContent=list.length+' 支影片';$('rows').innerHTML=list.map(v=>{const overdue=v.status!=='已上片'&&v.date<today();return '<tr><td><input aria-label="影片名稱" data-id="'+v.id+'" data-field="title" value="'+h(v.title)+'">'+(overdue?'<div class="overdue">逾期未完成</div>':'')+'</td><td><input aria-label="客戶" data-id="'+v.id+'" data-field="client" value="'+h(v.client)+'"></td><td><input aria-label="負責人" data-id="'+v.id+'" data-field="owner" value="'+h(v.owner)+'"></td><td><input type="date" aria-label="截止日期" data-id="'+v.id+'" data-field="date" value="'+h(v.date)+'"></td><td><select aria-label="工作狀態" data-id="'+v.id+'" data-field="status">'+STAGES.map(s=>'<option '+(v.status===s?'selected ':'')+'value="'+h(s)+'">'+h(s)+'</option>').join('')+'</select></td><td>'+(v.status==='已上片'?'<span class="done">✓ 已完成</span>':'<button class="smallbtn" data-next="'+v.id+'">下一階段 ›</button>')+' <button class="smallbtn" data-edit="'+v.id+'">編輯</button></td></tr>'}).join('')||'<tr><td colspan="6" style="text-align:center;padding:24px;color:#6a7487">目前沒有符合條件的影片，請新增或調整篩選條件。</td></tr>'; $('clients').innerHTML=clients.map(c=>'<option value="'+h(c)+'"></option>').join('');$('owners').innerHTML=[...new Set(data.map(v=>v.owner))].map(o=>'<option value="'+h(o)+'"></option>').join('')}
function openForm(id=null){editId=id;const v=data.find(x=>x.id===id);$('editor').classList.remove('hidden');$('editorTitle').textContent=v?'編輯影片':'快速新增影片';$('title').value=v?.title||'';$('client').value=v?.client||lastClient;$('owner').value=v?.owner||lastOwner;$('due').value=v?.date||today();$('deleteBtn').classList.toggle('hidden',!v||member?.role!=='admin');$('title').focus()}function closeForm(){editId=null;$('editor').classList.add('hidden')}function commit(){task(async()=>{const title=$('title').value.trim(),client=$('client').value.trim(),owner=$('owner').value.trim(),date=$('due').value;if(!title||!client||!owner||!date){message('請填寫全部欄位');return}const fields={title,client,owner,due_date:date};const q=editId===null?db.from('videos').insert({...fields,status:STAGES[0]}):db.from('videos').update(fields).eq('id',editId);const {error}=await q.select('id').single();if(error)throw error;lastClient=client;lastOwner=owner;$('month').value=date.slice(0,7);clientFilter='all';$('search').value='';closeForm();await load();message('✓ 已儲存至雲端')})}function mutate(id,field,value){task(async()=>{if(!value.trim()){render();message('欄位不可留空');return}const {error}=await db.from('videos').update({[field==='date'?'due_date':field]:value.trim()}).eq('id',id).select('id').single();if(error)throw error;if(field==='date')$('month').value=value.slice(0,7);await load();message('✓ 已儲存至雲端')})}$('addBtn').onclick=()=>{if(!busy)openForm()};$('cancelBtn').onclick=closeForm;$('saveBtn').onclick=commit;$('deleteBtn').onclick=()=>{if(member?.role!=='admin'||editId===null||!confirm('確定刪除此影片？'))return;task(async()=>{const {error}=await db.from('videos').delete().eq('id',editId).select('id').single();if(error)throw error;closeForm();await load();message('影片已刪除')})};$('rows').addEventListener('click',e=>{const n=e.target.closest('[data-next]'),b=e.target.closest('[data-edit]');if(n){const v=data.find(x=>x.id===Number(n.dataset.next));if(v){const i=STAGES.indexOf(v.status);if(i<STAGES.length-1)mutate(v.id,'status',STAGES[i+1])}}else if(b)openForm(Number(b.dataset.edit))});$('rows').addEventListener('chan
